
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      # 1) Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3) Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4) Lint
      - name: Lint
        run: npm run lint

      # 5) Test with coverage
      - name: Test (with coverage)
        run: npm test -- --coverage
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/studymatch_test
          JWT_SECRET: studymatch-ci-test-only-secret-not-for-production

      # 6) Upload coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage
