$kind: http-request
url: http://127.0.0.1:3000/api/profiles/999
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 404\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      pm.test(\"Error message is correct\", function () {\r

      \    const response = pm.response.json();\r

      \r

      \    pm.expect(response.error).to.eql(\"Profile not found\");\r

      });"
    language: text/javascript
order: 5000
